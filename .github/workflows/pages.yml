name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - 'scripts/build_demo_site.py'
      - 'tests/test_web_demo.py'
      - 'tests/web_demo_smoke.cjs'
      - 'examples/preview/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'RHFran/paper-tracker'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify static demo
        run: |
          python3 scripts/build_demo_site.py --check
          python3 -m unittest discover -s tests -p test_web_demo.py -v
          node tests/web_demo_smoke.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static demo
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
