[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-tracker"
version = "3.1.0"
description = "Super Paper radar: evidence-grounded research digests with safe scheduled email delivery"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["Pillow>=11.0", "tzdata>=2024.1; sys_platform == 'win32'"]
keywords = ["literature", "research", "digest", "crossref", "europe-pmc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
paper-tracker = "literature_digest.cli:main"
literature-digest = "literature_digest.cli:main"

[tool.setuptools.packages.find]
include = ["literature_digest*"]
